name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Create missing Decap Markdown files from the Wix archive
        run: python3 scripts/migrate_wix_posts.py
      - name: Keep the one-time Markdown migration in the repository
        run: |
          git add content/posts/*.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Migrate Wix posts for Decap CMS"
            git push
          fi
      - name: Build with original images
        run: python3 build.py
      - name: Validate full content and local media
        run: python3 validate.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
