name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Zusätzliche Website auf GitHub Pages veröffentlichen'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with original images
        run: python3 build.py
      - name: Validate full content and local media
        run: python3 validate.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
